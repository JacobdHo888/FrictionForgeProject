<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrictionForge - Dispatch Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vulcan: {
                            950: '#030303', // Deepest black
                            900: '#080808', // Background
                            800: '#121212', // Panels
                            700: '#1f1f1f', // Borders
                            600: '#333333', // Muted elements
                            500: '#555555',
                            400: '#888888', // Secondary text
                            300: '#aaaaaa',
                            100: '#e0e0e0', // Primary text
                        },
                        status: {
                            green: '#10b981',   // Confirmed / Success
                            amber: '#f59e0b',   // Pending / Needs Review / Extraction
                            red: '#ef4444',     // Anomalies / Rejections / Failures
                            purple: '#d946ef',  // Ledger / Financial
                            blue: '#3b82f6',    // Actions
                            cyan: '#06b6d4',    // Intercepts
                        }
                    },
                    fontFamily: {
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                        sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    animation: {
                        'log-pulse': 'logPulse 1.5s ease-out forwards',
                        'ledger-flash': 'ledgerFlash 1.5s ease-out forwards',
                    },
                    keyframes: {
                        logPulse: {
                            '0%': { backgroundColor: 'rgba(255, 255, 255, 0.08)', boxShadow: 'inset 2px 0 0 0 rgba(255,255,255,0.5)' },
                            '100%': { backgroundColor: 'transparent', boxShadow: 'inset 0 0 0 0 transparent' },
                        },
                        ledgerFlash: {
                            '0%': { borderColor: '#d946ef', boxShadow: 'inset 0 0 30px rgba(217, 70, 239, 0.15), 0 0 15px rgba(217, 70, 239, 0.2)' },
                            '100%': { borderColor: '#1f1f1f', boxShadow: 'none' },
                        }
                    }
                }
            }
        }
    </script>
        <style>
        body { 
            background-color: #030303; 
            color: #e0e0e0; 
            overflow: hidden; 
        }
        /* Industrial scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }
        
        /* Modern Monitoring Wall Grid Background */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
        
        /* Subtle radial gradient to darken edges */
        .vignette {
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body class="grid-bg">
    <div class="fixed inset-0 vignette z-0"></div>
    <div id="root" class="h-screen w-screen relative z-10"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
